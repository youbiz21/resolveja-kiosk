<form [formGroup]="form()">
    <div class="label">1. Formato</div>
    <div class="flex flex-column align-content-center justify-content-center flex-wrap gap-3 sm:flex-row">
        <app-icon-card class="flex-initial border-round-lg surface-300 w-8rem" icon="cadeira">
            <ng-template #label>
                <span class="block">Assento</span>
            </ng-template>
            <p-radioButton formControlName="areaALimpar" value="assento" />
        </app-icon-card>
        <app-icon-card class="flex-initial border-round-lg surface-300 w-8rem" icon="cadeira">
            <ng-template #label>
                <span class="block text-center">Assento e Costas</span>
            </ng-template>
            <p-radioButton formControlName="areaALimpar" value="assentoCostas" />
        </app-icon-card>
        <app-icon-card class="flex-initial border-round-lg surface-300 w-8rem" icon="cadeira">
            <ng-template #label>
                <span class="block text-center">Assento, Costas e Braços</span>
            </ng-template>
            <p-radioButton formControlName="areaALimpar" value="assentoCostasBraco" />
        </app-icon-card>        
    </div>
    <div class="label">2.Caracteristicas</div>
    <div class="flex flex-wrap gap-3 justify-content-center">
        <div class="w-4rem">
            <label class="block" for="tecido">Tecido</label>
            <p-radioButton formControlName="caracteristica" inputId="tecido"  value="tecido" />
        </div>
        <div class="w-4rem">
            <label class="block" for="pele">Pele</label>
            <p-radioButton formControlName="caracteristica" inputId="pele"  value="pele" />
        </div>
    </div>
    <div class="label">3.Serviço</div>
    <div class="flex flex-wrap gap-3 justify-content-center">
        <p-toggleButton class="w-full sm:w-12rem" styleClass="w-full sm:w-12rem" formControlName="limpeza" onLabel="Limpeza" offLabel="Limpeza"></p-toggleButton>
    </div>
    <div class="label">3. Tratamento</div>
    <div class="flex flex-wrap gap-3 justify-content-center">
        <p-toggleButton class="w-full sm:w-12rem" styleClass="w-full sm:w-12rem" formControlName="impermeabilizacao" onLabel="Impermeabilização" offLabel="Impermeabilização"></p-toggleButton>
    </div>
</form>
